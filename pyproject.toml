[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-exchanger-conjugate-xpinn"
version = "1.0.0"
authors = [
  { name="Mohammed Basra", email="mohammedbasra.star@gmail.com" },
]
description = "Extended Physics-Informed Neural Network (XPINN) for Conjugate Heat Transfer (CHT) in Turbomachinery Blade Cooling and Heat Exchangers"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]
